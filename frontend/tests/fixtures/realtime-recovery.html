<!doctype html><html lang="vi"><meta charset="utf-8"><title>Realtime recovery QA</title>
<style>
  #qa {position:fixed;z-index:10000;top:0;left:0;max-width:650px;background:#fff;color:#111;padding:10px;font:12px monospace;max-height:45vh;overflow:auto}
  #qa button,#qa a {margin:3px} #qa pre {white-space:pre-wrap;margin:4px}
</style>
<section id="qa">
  <strong>Realtime recovery — disposable backend only</strong>
  <div><select id="count" aria-label="Số đội"><option>4</option><option>8</option><option>20</option></select>
    <button id="create">Tạo trận kiểm thử</button><span id="links"></span></div>
  <div id="controls" hidden>
    <button id="deploy">Đối thủ tạo bộ binh</button><button id="build">Đối thủ xây tháp</button>
    <button id="drop">Chặn snapshot WebSocket</button><button id="sync">Đồng bộ ngay</button>
    <button id="fail">Làm lỗi một sự kiện</button><button id="compare">Đối chiếu server/store/map</button>
  </div>
  <pre id="result">Chưa tạo trận.</pre><pre id="metrics"></pre>
</section><div id="root"></div>
<script type="module">
import React from '/node_modules/.vite/deps/react.js';
import ReactDOM from '/node_modules/.vite/deps/react-dom_client.js';
import {BattleScene} from '/src/game/scenes/BattleScene.ts';
import {useMatchStore} from '/src/stores/matchStore.ts';
import {wsClient} from '/src/services/websocket.ts';
import {App} from '/src/App.tsx';
import '/src/index.css';

const result = document.querySelector('#result'), metrics = document.querySelector('#metrics');
const query = new URLSearchParams(location.search);
let room = query.get('room') ? JSON.parse(localStorage.getItem(`recovery-qa-${query.get('room')}`)) : null;
const viewer = Number(query.get('viewer') || 0);
let scene, dropSnapshots = false, failNext = false, httpRecoveries = 0;
const errors = [];
window.addEventListener('error', e => errors.push(e.message));
window.addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
const create = BattleScene.prototype.create;
BattleScene.prototype.create = function(...args) {scene = this; return create.apply(this, args);};
async function api(path, data, token, host = false) {
  const response = await fetch(`/api/v1${path}`, {method: data === undefined ? 'GET' : 'POST',
    headers: {'Content-Type': 'application/json', ...(token ? {[host ? 'X-Host-Token' : 'X-Participant-Token']: token} : {})},
    ...(data === undefined ? {} : {body: JSON.stringify(data)})});
  if (!response.ok) throw new Error(`${path}: ${response.status} ${await response.text()}`);
  return response.json();
}
function showLinks() {
  const links = document.querySelector('#links'); links.replaceChildren();
  for (const i of [0, 1]) {
    const a = document.createElement('a'); a.textContent = `Mở người chơi ${i + 1}`;
    a.href = `/tests/fixtures/realtime-recovery.html?room=${room.match.id}&viewer=${i}`; a.target = '_blank'; links.append(a);
  }
}
function action(id, fn) {
  document.querySelector(id).onclick = async () => {
    try {await fn();} catch (e) {result.textContent = `FAIL: ${e.message}`;}
  };
}
action('#create', async () => {
  result.textContent = 'Đang tạo trận tạm...';
  const count = Number(document.querySelector('#count').value);
  const match = await api('/matches/', {name: `Recovery QA ${count}`, configuration: {
    max_teams: count, initial_coins: 5000, tower_placement_version: 0, arena_layout_version: 5,
    first_preparation_duration_seconds: 300, preparation_duration_seconds: 300, battle_duration_seconds: 300}});
  room = {match, teams: [], joins: []};
  for (let i = 0; i < count; i++) {
    const team = await api(`/matches/${match.id}/teams/`, {name: `QA ${i + 1}`}, match.host_token, true);
    room.teams.push(team);
    room.joins.push(await api(`/matches/${match.id}/join/`, {display_name: `QA player ${i + 1}`, team_id: team.id, role: 'MENTEE'}));
    await api(`/matches/${match.id}/teams/${team.id}/ready/`, {is_ready: true}, match.host_token, true);
  }
  await api(`/matches/${match.id}/start/`, {}, match.host_token, true);
  localStorage.setItem(`recovery-qa-${match.id}`, JSON.stringify(room)); showLinks();
  result.textContent = `READY: ${count} đội. Mở hai người chơi ở hai tab.`;
});
if (room) {
  showLinks(); document.querySelector('#controls').hidden = false;
  sessionStorage.clear();
  sessionStorage.setItem('tower_active_match_id', room.match.id);
  sessionStorage.setItem('tower_participant_token', room.joins[viewer].participant_token);
  sessionStorage.setItem('tower_active_member', JSON.stringify(room.joins[viewer].member));
  const originalConnect = wsClient.connect.bind(wsClient), wrapped = new WeakSet();
  wsClient.connect = (...args) => {
    originalConnect(...args);
    const socket = wsClient.ws;
    if (!socket || wrapped.has(socket)) return;
    wrapped.add(socket); const receive = socket.onmessage;
    socket.onmessage = e => {
      const envelope = JSON.parse(e.data);
      if (dropSnapshots && ['MATCH_STATE_SNAPSHOT', 'JSON_CHUNK'].includes(envelope.event_type)) return;
      receive(e);
    };
  };
  const loadSnapshot = wsClient.snapshotLoader.bind(wsClient);
  wsClient.snapshotLoader = async (...args) => {httpRecoveries++; return loadSnapshot(...args);};
  const applyEvent = useMatchStore.getState().applyEvent;
  useMatchStore.setState({applyEvent(envelope) {
    if (failNext && ['UNIT_DEPLOYED', 'TOWER_BUILT'].includes(envelope.event_type)) {
      failNext = false; throw new Error('QA injected reducer failure');
    }
    return applyEvent(envelope);
  }});
  const other = 1 - viewer;
  action('#deploy', async () => {
    const data = await api(`/matches/${room.match.id}/actions/deploy/`, {
      unit_type_code_or_id: 'infantry', target_team_id: room.teams[viewer].id, idempotency_key: crypto.randomUUID()}, room.joins[other].participant_token);
    result.textContent = `DEPLOYED: ${data.entity.id}`;
  });
  action('#build', async () => {
    const snapshot = await api(`/matches/${room.match.id}/snapshot/`);
    const existing = new Set(snapshot.payload.entities.map(e => e.current_node_id));
    const slot = [1, 2, 3].find(i => !existing.has(`node_tower_t${other + 1}_slot${i}`));
    if (!slot) throw new Error('QA tower slots occupied');
    const data = await api(`/matches/${room.match.id}/actions/build/`, {
      unit_type_code_or_id: 'mg_tower', node_id: `node_tower_t${other + 1}_slot${slot}`, idempotency_key: crypto.randomUUID()}, room.joins[other].participant_token);
    result.textContent = `BUILT: ${data.entity.id}`;
  });
  action('#drop', () => {dropSnapshots = !dropSnapshots; result.textContent = `DROP_WS_SNAPSHOTS: ${dropSnapshots}`;});
  action('#sync', () => {wsClient.requestSync(); result.textContent = 'SYNC_REQUESTED';});
  action('#fail', () => {failNext = true; result.textContent = 'NEXT_ENTITY_EVENT_WILL_FAIL_ONCE';});
  action('#compare', async () => {
    const snapshot = await api(`/matches/${room.match.id}/snapshot/`, undefined, room.joins[viewer].participant_token);
    const expected = snapshot.payload.entities.map(e => e.id).sort();
    const state = useMatchStore.getState(), actual = state.entities.map(e => e.id).sort();
    const visuals = [...scene.visuals.keys()].sort();
    const okay = JSON.stringify(expected) === JSON.stringify(actual) && JSON.stringify(expected) === JSON.stringify(visuals);
    result.textContent = JSON.stringify({result: okay ? 'PASS' : 'FAIL', serverVersion: snapshot.sequence_number,
      storeVersion: state.lastSequenceNumber, serverEntities: expected.length, storeEntities: actual.length,
      visualEntities: visuals.length, httpRecoveries, errors});
  });
  history.replaceState(null, '', `/battle/${room.match.id}`);
  ReactDOM.createRoot(document.querySelector('#root')).render(React.createElement(App));
  setInterval(() => {
    const state = useMatchStore.getState();
    metrics.textContent = JSON.stringify({viewer: viewer + 1, status: state.connectionStatus,
      storeEntities: state.entities.length, visualEntities: scene?.visuals.size || 0, httpRecoveries,
      ...wsClient.getDiagnostics()});
  }, 250);
}
</script></html>
