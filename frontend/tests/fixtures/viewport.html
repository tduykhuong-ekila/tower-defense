<!doctype html>
<html lang="vi">
  <meta charset="utf-8" /><title>Kiểm tra kích thước chiến trường</title
  ><style>
    body {
      margin: 0;
      background: #18271e;
      display: grid;
      place-content: center;
      min-height: 100vh;
      color: #d9d7b8;
      font: 12px system-ui;
      gap: 12px;
    }
    p {
      margin: 0;
      text-align: center;
    }
    iframe {
      border: 1px solid #6c7e58;
      box-shadow: 0 10px 60px #0005;
      border-radius: 8px;
      max-width: 100vw;
    }
  </style>
  <p>Kiểm tra giao diện trên khung nhìn nhỏ · Dữ liệu trận đấu thật</p>
  <iframe title="Chiến trường trên điện thoại"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const frame = document.querySelector("iframe");
    frame.width = Number(params.get("width")) || 390;
    frame.height = Number(params.get("height")) || 844;
    frame.src = "/battle/" + encodeURIComponent(params.get("match") || "") + (params.has("performance") ? "?performance=1" : "");
  </script>
</html>
