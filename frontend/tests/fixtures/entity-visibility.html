<!doctype html>
<html><meta charset="utf-8"><title>Entity visibility regression</title>
<style>body{margin:0;background:#17251d;color:white;font:15px monospace}#result{white-space:pre-wrap;padding:12px}#game{height:700px}</style>
<pre id="result">RUNNING</pre><div id="game"></div>
<script type="module">
import Phaser from 'phaser';
import {BootScene} from '/src/game/scenes/BootScene.ts';
import {BattleScene} from '/src/game/scenes/BattleScene.ts';
import {EMPTY_SCENE} from '/src/game/bridge.ts';
const fixtures = await fetch('/tests/fixtures/grid-maps.json').then(r => r.json());
const map = fixtures[0].map;
const failures = [], checks = [];
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const codes = ['infantry', 'tank', 'artillery', 'mg_tower', 'cannon_tower', 'shield_generator'];
const report = () => document.querySelector('#result').textContent = JSON.stringify({
  status: failures.length ? 'FAIL' : 'PASS', checks, failures,
}, null, 2);
window.addEventListener('error', e => {failures.push(e.message); report();});
window.addEventListener('unhandledrejection', e => {failures.push(String(e.reason)); report();});
function entities(prefix) {
  return codes.map((code, i) => ({id: `${prefix}-${code}`, team_id: map.team_ids[1],
    unit_code: code, entity_kind: i < 3 ? 'UNIT' : 'TOWER', current_hp: 100, max_hp: 100,
    current_shield: 0, level: 1, status: 'ACTIVE', current_node_id: 'node_spawn_t2',
    target_team_id: null, simulation_state: {world_position: {x: i * 35, y: 0}}}));
}
function check(scene, name, expected) {
  const missing = expected.filter(e => {
    const v = scene.visuals.get(e.id);
    return !v || !v.root.active || !v.root.visible || v.root.alpha < .99 ||
      v.root.scaleX < .89 || !scene.textures.exists(v.sprite.texture.key);
  }).map(e => ({id: e.id, alpha: scene.visuals.get(e.id)?.root.alpha}));
  checks.push({name, expected: expected.length, missing});
  if (missing.length) failures.push(name);
}
const game = new Phaser.Game({type: Phaser.AUTO, parent: 'game', width: 1440, height: 700,
  audio: {noAudio: true}, scene: [BootScene, BattleScene]});
game.events.once('battle-ready', async scene => {
  try {
    let state = {...EMPTY_SCENE, mapData: map, entities: []};
    scene.updateState(state);
    scene.navigate(map.arena?.centerX || 800, (map.arena?.centerY || 520) + 60, .6);
    // Snapshot/tab-return interrupts a newly received opponent purchase before
    // Phaser has rendered even one frame of its appearance tween.
    state = {...state, entities: entities('snapshot')};
    scene.updateState(state); scene.skipCombat();
    await wait(500); check(scene, 'preparation snapshot interrupts appearance', state.entities);
    // Simulate a body already stranded by an earlier interrupted fade.
    for (const v of scene.visuals.values()) v.root.setAlpha(0).setScale(.9);
    scene.updateState(state); scene.skipCombat();
    await wait(500); check(scene, 'later snapshot repairs existing invisible bodies', state.entities);
    // A server position correction can cancel the same root tween independently.
    state = {...state, entities: entities('movement').map(e => ({...e, simulation_state: undefined}))};
    scene.updateState(state);
    state = {...state, entities: state.entities.map(e => ({...e, current_node_id: 'node_spawn_t1'}))};
    scene.updateState(state);
    scene.focusBase(map.team_ids[0]);
    await wait(650); check(scene, 'position correction interrupts appearance', state.entities);
    // Legacy movement replay also replaces the root tween.
    state = {...state, entities: entities('replay')}; scene.updateState(state);
    for (const e of state.entities) scene.animateEvent({type:'UNIT_MOVED',entity_id:e.id,to_node:'node_spawn_t1'}, 100);
    await wait(400); check(scene, 'legacy replay interrupts appearance', state.entities);
    // Live snapshots must preserve normal locomotion and appearance completion.
    scene.navigate(map.arena?.centerX || 800, (map.arena?.centerY || 520) + 60, .6);
    state = {...state, liveBattle: true, entities: entities('live')};
    scene.updateState(state); scene.skipCombat();
    await wait(500); check(scene, 'live snapshot preserves appearance', state.entities);
    // An offscreen body must become visible when returning to its coordinates.
    scene.cameras.main.scrollX += 10000;
    await wait(150);
    scene.navigate(map.arena?.centerX || 800, (map.arena?.centerY || 520) + 60, .6);
    await wait(500); check(scene, 'camera returns to opponent bodies', state.entities);
    // Switching out of live combat must allow in-flight destruction to finish.
    const destroyed = state.entities.map(e => e.id);
    scene.playLiveEvents(destroyed.map(entity_id => ({type: 'ENTITY_DESTROYED', entity_id})));
    state = {...state, liveBattle: false, entities: []};
    scene.updateState(state); scene.skipCombat();
    await wait(400);
    const lingering = destroyed.filter(id => scene.visuals.has(id) || scene.deaths.has(id));
    checks.push({name: 'destroyed bodies finish cleanup after snapshot/pause', expected: 0, lingering});
    if (lingering.length) failures.push('destroyed bodies finish cleanup after snapshot/pause');
    state = {...state, entities: entities('pooled')};
    scene.updateState(state); scene.skipCombat();
    await wait(500); check(scene, 'pooled infantry and new vehicles remain visible', state.entities);
    report();
  } catch (e) {failures.push(String(e.stack || e)); report();}
});
</script></html>
