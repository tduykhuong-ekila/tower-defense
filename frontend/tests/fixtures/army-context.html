<!doctype html><html><meta charset="utf-8"><title>Army context command verification</title>
<div id="root"><button id="start">Tạo trận kiểm thử chỉ huy</button><p id="status"></p></div>
<script type="module">
// Explicit, disposable local integration setup; no existing rooms are modified.
import {BattleScene} from '/src/game/scenes/BattleScene.ts';
import {useMatchStore} from '/src/stores/matchStore.ts';
const create=BattleScene.prototype.create;
BattleScene.prototype.create=function(...args){window.flowScene=this;return create.apply(this,args);};
window.flowStore=useMatchStore;
document.querySelector('#start').onclick=async()=>{
 const status=document.querySelector('#status');
 try {
  status.textContent='Đang tạo trận kiểm thử…';
  async function api(path,data,token,host=false){
   const response=await fetch('/api/v1'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(token?{[host?'X-Host-Token':'X-Participant-Token']:token}:{})},...(data===undefined?{}:{body:JSON.stringify(data)})});
   if(!response.ok)throw Error(await response.text()); return response.json();
  }
  const match=await api('/matches/',{name:'Context command QA',configuration:{max_teams:3,initial_coins:5000,first_preparation_duration_seconds:600,battle_duration_seconds:600}});
  const teams=[];let join;
  for(let i=0;i<3;i++){
   const team=await api(`/matches/${match.id}/teams/`,{name:`QA ${i+1}`},match.host_token,true);teams.push(team);
   const member=await api(`/matches/${match.id}/join/`,{display_name:`QA Player ${i+1}`,team_id:team.id,role:'MENTEE'});
   if(i===0)join=member;
   await api(`/matches/${match.id}/teams/${team.id}/ready/`,{is_ready:true},match.host_token,true);
  }
  await api(`/matches/${match.id}/start/`,{},match.host_token,true);
  await api(`/matches/${match.id}/actions/deploy/`,{unit_type_code_or_id:'infantry',target_team_id:teams[1].id,quantity:4,idempotency_key:crypto.randomUUID()},join.participant_token);
  await api(`/matches/${match.id}/advance-phase/`,{},match.host_token,true);
  sessionStorage.clear();
  sessionStorage.setItem('tower_active_match_id',match.id);
  sessionStorage.setItem('tower_participant_token',join.participant_token);
  sessionStorage.setItem('tower_active_member',JSON.stringify(join.member));
  history.replaceState(null,'',`/battle/${match.id}`);
  await import('/src/main.tsx');
 }catch(error){status.textContent=error.message;}
};
</script></html>
